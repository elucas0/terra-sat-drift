[project]
name = "terra-sat-drift"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eo-learn>=1.5.0",
    "geopandas>=0.14.4",
    "h5py>=3.16.0",
    "opencv-python>=4.13.0.92",
    "seaborn>=0.13.2",
    "sentinelhub[aws]>=3.8.3",
    "setuptools==69.5.1",
    "sunpy>=7.0.5",
    "terratorch>=1.2.4",
    "torchgeo>=0.7.0",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
[tool.setuptools.packages.find]
include = ["terra_sat_drift*"]
